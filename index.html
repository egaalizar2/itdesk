const shrink = f => new Promise((ok, no) => { const im = new Image(), u = URL.createObjectURL(f); im.onload = () => { const r = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * r; c.height = im.height * r; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); c.toBlob(b => { URL.revokeObjectURL(u); ok(b); }, 'image/jpeg', .8); }; im.onerror = () => no(new Error('File bukan gambar')); im.src = u; });
const toURL = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });
async function saveFotos(tid, cid) {
  for (const p of S.ph) {
    let url; if (IS_PREVIEW) url = await toURL(p.b); else { const path = `${tid}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.jpg`, { error } = await sb.storage.from('ticket-files').upload(path, p.b, { contentType: 'image/jpeg' }); if (error) throw error; url = sb.storage.from('ticket-files').getPublicUrl(path).data.publicUrl; }
    await db.ins('ticket_attachments', { ticket_id: tid, comment_id: cid || null, nama_file: p.n, url, ukuran: p.b.size });
  } S.ph = [];
}
const phH = () => S.ph.map((p, i) => `<span><img src="${p.u}"><em data-a=phx data-i=${i}>×</em></span>`).join('');
const gal = L => L.length ? `<div class=ph>${L.map(f => `<img src="${esc(f.url)}" data-a=zoom data-u="${esc(f.url)}" loading=lazy>`).join('')}</div>` : '';
// ===== Aksi =====
const A = {
  phx: d => { S.ph.splice(+d.i, 1); $('#phl').innerHTML = `<div class=ph>${phH()}</div>`; },
  zoom: d => modal(`<img src="${esc(d.u)}" style="width:100%;border-radius:8px"><div class=row><button class="btn g2" data-a=cm>Tutup</button></div>`),
  go: d => go(d.v, d.id ? { id: +d.id } : {}), cm: (d, t, e) => { if (e.target == t || !t.classList.contains('ov')) closeM(); },

  logout: () => { S.u = null; try { localStorage.removeItem('itd_u'); } catch (e) {} draw(); },
  login: async () => { const u = await db.login($('#lu').value.trim(), $('#lp').value); if (!u) return toast('Username atau password salah', 1); login(u); },
  qlogin: d => { const n = { admin: 'Administrator IT', enduser: 'Budi Santoso', lead: 'Lead IT', support: 'Teknisi IT' }; login({ id: { admin: 1, enduser: 2, lead: 3, support: 4 }[d.r], username: d.r, nama: n[d.r], role: d.r, department: d.r == 'enduser' ? 'Weaving' : 'IT', lokasi: 'Gedung A', telepon: '0812' }); },
  prof: () => { $('#dd').classList.remove('sh'); modal(`<h3>Profil & Akses User</h3><p><b>${esc(S.u.nama)}</b> (@${esc(S.u.username)})<br>Role: <span class=rb>${RL[S.u.role]}</span><br>Departemen: ${esc(S.u.department || '-')}<br>Lokasi: ${esc(S.u.lokasi || '-')}</p><button class="btn g2" data-a=cm>Tutup</button>`); },
  al: () => { const B = (S.T || []).filter(bad); modal(`<h3 style=color:#DC2626>⚠ Peringatan SLA</h3>${B.length ? B.map(t => `<p><b>${t.no_tiket}</b> ${esc(t.judul)} <button class="btn g2" data-a=go data-v=tk data-id=${t.id}>Lihat</button></p>`).join('') : '<p>Tidak ada tiket yang melewati SLA 🎉</p>'}<button class="btn g2" data-a=cm>Tutup</button>`); },
  mode: d => { S.mode = d.m; view(); }, fl: d => { S.f = d.f; view(); }, rst: () => { Object.assign(S, { q: '', pr: '', cat: '', ag: '', f: 'all' }); view(); },
  newt: d => { S.nt = d.t; go('new'); },
  fmt: d => document.execCommand(d.m),
  submit: async () => {

    const x = await db.ins('tickets', { tipe: ty, judul: g('f_j'), deskripsi: ds, kategori: g('f_c'), subkategori: g('f_s'), prioritas: pr, status: 'open', requester_id: S.u.id, asset_id: am ? am.id : null, aset_manual: am ? null : (av || null), lokasi: g('f_l') || S.u.lokasi || null, due_resolusi: new Date(Date.now() + SLA[pr] * 36e5).toISOString() });
    if (S.ph.length) await saveFotos(x.id); toast('Tiket ' + x.no_tiket + ' berhasil dibuat'); go('tk', { id: x.id });
  },
  reply: async d => { const v = $('#rp').value.trim(); if (!v) return toast('Isi balasan kosong', 1); const i = document.querySelector('input[name=rt]:checked'); const c = await db.ins('ticket_comments', { ticket_id: +d.id, author_id: S.u.id, isi: v, is_internal: !!(i && i.value == '1') }); if (S.ph.length) await saveFotos(+d.id, c.id); toast('Balasan terkirim'); view(); },
  stok: async d => { const n = $('#sn').value.trim(); if (!n) return toast('Catatan wajib diisi', 1); closeM(); await setSt(+d.id, d.s, n); },
  asgm: d => modal(`<h3>Tugaskan Tiket</h3><select id=as>${staff().map(u => `<option value=${u.id}>${esc(u.nama)} (${S.T.filter(t => t.assignee_id == u.id && !FIN.includes(t.status)).length} aktif)`).join('')}</select><textarea id=ar rows=2 placeholder="Alasan (wajib jika tugaskan ulang)"></textarea><div class=row><button class="btn g2" data-a=cm>Batal</button><button class=btn data-a=asg data-id=${d.id}>Tugaskan</button></div>`),
  asg: async d => { const a = +$('#as').value, r = $('#ar').value.trim(), t = S.T.find(x => x.id == d.id); if (t.assignee_id && !r) return toast('Alasan wajib diisi', 1); const u = { assignee_id: a }; if (t.status == 'open') u.status = 'progress'; await db.upd('tickets', t.id, u); await db.ins('ticket_comments', { ticket_id: t.id, author_id: S.u.id, isi: `Ditugaskan ke ${N[a]}${r ? ': ' + r : ''}`, is_internal: true }); closeM(); toast('Tiket ditugaskan'); view(); },
  close: d => setSt(+d.id, 'closed'), reopen: d => setSt(+d.id, 'open', 'dibuka kembali oleh pemohon'),

  },
  fs: async d => {
    const c = CFG[d.n], o = {}; document.querySelectorAll('#M [data-f]').forEach(e => { const k = e.dataset.f, f = c.f.find(x => x[0] == k); let v = e.value.trim(); if (k == 'aktif') v = v == 'true'; else if (f[2] == 'number') v = v ? +v : null; else if (v == '') v = null; o[k] = v; });
    if (d.id && o.password_hash == null) delete o.password_hash;
    if (c.req.some(k => !o[k]) || (d.n == 'users' && !d.id && !o.password_hash)) return toast('Lengkapi data wajib', 1);
    if (d.n == 'kb' && !o.kategori) o.kategori = 'Lainnya';
    d.id ? await db.upd(c.t, +d.id, o) : await db.ins(c.t, o); S.U = null; closeM(); toast('Data tersimpan'); view();
  },
  fdl: async d => { if (!confirm('Hapus data ini?')) return; await db.del(CFG[d.n].t, +d.id); toast('Data dihapus'); view(); }
};
const C = {
  q: v => { S.q = v; view(); }, pr: v => { S.pr = v; view(); }, cat: v => { S.cat = v; view(); }, ag: v => { S.ag = v; view(); }, kq: v => { S.kq = v; view(); },
  pick: async (v, el) => { try { for (const f of [...el.files]) { if (S.ph.length >= 5) { toast('Maksimal 5 foto', 1); break; } const b = await shrink(f); S.ph.push({ n: f.name, b, u: URL.createObjectURL(b) }); } } catch (x) { toast(x.message, 1); } el.value = ''; $('#phl').innerHTML = `<div class=ph>${phH()}</div>`; },

  }
};
const I = { ks: v => { const k = v.trim().toLowerCase(), L = k ? (S.K || []).filter(a => (a.judul + a.isi).toLowerCase().includes(k)).slice(0, 5) : []; $('#ksr').innerHTML = k ? `<div class=card style=margin-bottom:8px>${L.map(a => `<div class=sg data-a=ka data-id=${a.id}>📖 ${esc(a.judul)}</div>`).join('')}<div class=sg data-a=newt data-t=incident>➕ Tidak ketemu? <b>Buat Tiket</b></div></div>` : ''; } };
root.addEventListener('click', async e => { if (!e.target.closest('.pf,.dd')) $('#dd')?.classList.remove('sh'); const t = e.target.closest('[data-a]'); if (!t) return; if (t.classList.contains('ov') && e.target != t) return; try { await A[t.dataset.a]?.(t.dataset, t, e); } catch (x) { toast(x.message || 'Terjadi kesalahan', 1); } });

if (S.u) S.v = S.u.role == 'enduser' ? 'home' : 'dash'; draw();
